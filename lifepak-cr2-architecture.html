<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LIFEPAK CR2 Architecture Map</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#091019;color:#eef5ff}.wrap{max-width:1120px;margin:0 auto;padding:24px}.hero{padding:18px;border:1px solid #ffffff22;border-radius:14px;background:linear-gradient(135deg,#10313f,#102545)}.muted{color:#a5bed9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}input,select{background:#101a30;border:1px solid #2a3f68;color:#eaf1ff;padding:8px 10px;border-radius:10px}details{margin:10px 0;background:#0f172b;border:1px solid #223657;border-radius:12px;padding:10px}summary{cursor:pointer;font-weight:600}.item{padding:8px 10px;border:1px solid #223657;border-radius:10px;margin:8px 0;background:#0c1528}.k{font-size:12px;color:#9cb3d8}.tag{display:inline-block;font-size:11px;margin-left:8px;padding:2px 8px;border-radius:999px;border:1px solid #315382;background:#183056;color:#b5d4ff}</style></head>
<body><div class="wrap"><div class="hero"><h1>LIFEPAK CR2</h1><div class="muted">Mapped to your revised block/category taxonomy.</div></div>
<div class="toolbar"><input id="q" placeholder="Filter subsystem/component/category/block" style="min-width:320px"/><select id="cat"></select></div><div id="out"></div></div>
<script>
const rows=[
['Power Architecture','Primary battery module','POWER MGT','Battery'],
['Power Architecture','Conversion rails','POWER MGT','DC/DC'],
['Power Architecture','Local regulation','POWER MGT','LDO'],
['Power Architecture','Power control and self-test readiness','POWER MGT','Power Management Circuit'],
['HV Therapy Path','HV switching network','ANALOG','MOSFET/IGBT'],
['HV Therapy Path','Switch drive timing','ANALOG','Gate Drivers'],
['HV Therapy Path','Pulse capacitor bank','DISCRETES / PASSIVES','Capacitors'],
['HV Therapy Path','Protection/interlock path','DISCRETES / PASSIVES','Protection Device'],
['HV Therapy Path','Safety disconnect','ELECTROMECHANICAL','Relay'],
['ECG + Analysis','Input selection','ANALOG','MUX'],
['ECG + Analysis','AFE gain stage','ANALOG','OP-AMP'],
['ECG + Analysis','Signal filtering','ANALOG','Filter'],
['ECG + Analysis','Conversion to digital domain','ANALOG','Analog to Digital Convertor'],
['Compute / Control','Primary controller','MCU / CPU / DSP / DSC','MCU'],
['Compute / Control','Clock source','CLOCKING / TIMING MGT','Crystal Oscillators'],
['Compute / Control','Supervision and deterministic timing','ANALOG','Timing IC'],
['Memory & Logs','Program storage','MEMORY','Flash'],
['Memory & Logs','Persistent settings/events','MEMORY','EEPROM'],
['UI / Guidance','Display module','DISPLAY','LCD'],
['UI / Guidance','Display control','ANALOG','Display Driver'],
['UI / Guidance','Prompt/status lighting','OPTO & LIGHTING','LED'],
['UI / Guidance','Audio output amplifier','ANALOG','Audio Amplifier'],
['UI / Guidance','Acoustic output','ELECTROMECHANICAL','Speaker'],
['Connectivity','Wired interface','COMMUNICATION / INTERFACE','Wired Communication'],
['Connectivity','Wireless interface','COMMUNICATION / INTERFACE','Wireless Communication'],
['Connectivity','RF endpoint','COMMUNICATION / INTERFACE','RF Component-Antenna'],
['Interconnect','Patient/accessory interfaces','INTERCONNECT','Connector'],
['Sensors & Control','Current monitoring','SENSOR','Current Sensor'],
['Sensors & Control','Voltage monitoring','SENSOR','Voltage Sensor'],
['Sensors & Control','Thermal monitoring','SENSOR','Temperature'],
['Sensors & Control','Motion artifact awareness','SENSOR','Motion']
].map(([subsystem,component,category,block])=>({subsystem,component,category,block}));
const cats=['All',...new Set(rows.map(r=>r.category))];
const q=document.getElementById('q'),cat=document.getElementById('cat'),out=document.getElementById('out');
cat.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
function render(){const f=q.value.toLowerCase();const c=cat.value;const data=rows.filter(r=>(c==='All'||r.category===c)&&`${r.subsystem} ${r.component} ${r.category} ${r.block}`.toLowerCase().includes(f));const g={};data.forEach(r=>(g[r.subsystem]??=[]).push(r));out.innerHTML=Object.entries(g).map(([k,v])=>`<details open><summary>${k}<span class='tag'>${v.length}</span></summary>${v.map(x=>`<div class='item'><div><strong>${x.component}</strong></div><div class='k'>${x.category} • ${x.block}</div></div>`).join('')}</details>`).join('')||'<p class="muted">No matches</p>';}
q.addEventListener('input',render);cat.addEventListener('change',render);render();
</script></body></html>
