<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LIFEPAK 1000 Architecture Map + PN Shortlist</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#0a1020;color:#eaf1ff}.wrap{max-width:1150px;margin:0 auto;padding:24px}.hero{padding:18px;border:1px solid #ffffff22;border-radius:14px;background:linear-gradient(135deg,#132748,#0f1c36)}.muted{color:#a8bddf}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}input,select{background:#101a30;border:1px solid #2a3f68;color:#eaf1ff;padding:8px 10px;border-radius:10px}details{margin:10px 0;background:#0f172b;border:1px solid #223657;border-radius:12px;padding:10px}summary{cursor:pointer;font-weight:600}.item{padding:10px;border:1px solid #223657;border-radius:10px;margin:8px 0;background:#0c1528}.k{font-size:12px;color:#9cb3d8}.pn{font-size:12px;color:#bfe1ff;margin-top:4px}.c{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid #315382;background:#183056;color:#b5d4ff;display:inline-block;margin-top:6px}.warn{margin-top:10px;font-size:12px;color:#ffd38a}a{color:#8fd3ff;text-decoration:none}a:hover{text-decoration:underline}</style></head>
<body><div class="wrap"><div class="hero"><h1>LIFEPAK 1000</h1><div class="muted">Block mapping + candidate PN shortlist</div><div class="warn">Non-clinical research only. Candidate parts are not validated for medical deployment.</div></div>
<div class="toolbar"><input id="q" placeholder="Filter subsystem/component/category/block/vendor/pn" style="min-width:340px"/><select id="cat"></select><select id="conf"><option>All confidence</option><option>High</option><option>Medium</option><option>Low</option><option>N/A</option></select></div><div id="out"></div></div>
<script>
const rows=[
{ss:'Power Architecture',comp:'Main battery pack interface',cat:'POWER MGT',block:'Battery',conf:'Low',pns:[['TE 1-928918-1','https://www.te.com/usa-en/product-1-928918-1.html'],['Hirose DF13-2P-1.25V','https://www.hirose.com/product/en/products/DF13/']]},
{ss:'Power Architecture',comp:'Battery charging/supervision',cat:'POWER MGT',block:'Battery Charger',conf:'Medium',pns:[['Renesas ISL94202','https://www.renesas.com/us/en/products/power-management/battery-management/battery-monitoring/isl94202-li-ion-battery-pack-monitor'],['NXP MC33771C','https://www.nxp.com/products/MC33771C']]},
{ss:'Power Architecture',comp:'Primary conversion stage',cat:'POWER MGT',block:'DC/DC',conf:'Medium',pns:[['ST L7987','https://www.st.com/en/power-management/l7987.html'],['onsemi NCP3065','https://www.onsemi.com/products/power-management/dc-dc-converters/ncp3065']]},
{ss:'Power Architecture',comp:'Low-noise local rails',cat:'POWER MGT',block:'LDO',conf:'Medium',pns:[['onsemi NCP718','https://www.onsemi.com/products/power-management/linear-regulators-ldo/ncp718'],['ST LD39130','https://www.st.com/en/power-management/ld39130.html']]},
{ss:'HV Therapy Path',comp:'HV switch stage',cat:'ANALOG',block:'MOSFET/IGBT',conf:'Medium',pns:[['Infineon IPT015N10N5','https://www.infineon.com/part/IPT015N10N5'],['onsemi FGH40N60SFD','https://www.onsemi.com/products/discrete-power-modules/igbts/fgh40n60sfd']]},
{ss:'HV Therapy Path',comp:'Gate control',cat:'ANALOG',block:'Gate Drivers',conf:'Medium',pns:[['Infineon 1EDN7550','https://www.infineon.com/part/1EDN7550B'],['ST STGAP2S','https://www.st.com/en/power-management/stgap2s.html']]},
{ss:'HV Therapy Path',comp:'Pulse storage bank protection',cat:'DISCRETES / PASSIVES',block:'Protection Device',conf:'Medium',pns:[['Littelfuse SMCJ440A','https://www.littelfuse.com/products/tvs-diodes/smcj.aspx'],['Littelfuse V14E275P','https://www.littelfuse.com/products/varistors/leaded-varistors.aspx']]},
{ss:'HV Therapy Path',comp:'Output safety disconnect',cat:'ELECTROMECHANICAL',block:'Relay',conf:'Low',pns:[['TE T9AS1D22-12','https://www.te.com/usa-en/product-9-1393224-0.html'],['TE OJ-SS-112LM','https://www.te.com/usa-en/product-1-1419128-1.html']]},
{ss:'ECG Analog Front End',comp:'Input path switching',cat:'ANALOG',block:'Analog Switch',conf:'Low',pns:[['NXP NX3L4053','https://www.nxp.com/products/NX3L4053'],['NXP CBTL04083A','https://www.nxp.com/products/CBTL04083A']]},
{ss:'ECG Analog Front End',comp:'Signal conditioning',cat:'ANALOG',block:'OP-AMP',conf:'Medium',pns:[['ST TSV772','https://www.st.com/en/amplifiers-and-comparators/tsv772.html'],['Renesas ISL28134','https://www.renesas.com/us/en/products/amplifiers-buffer-comparators/operational-amplifiers-op-amps/isl28134-low-noise-precision-rail-rail-output-op-amp']]},
{ss:'Control Compute',comp:'Main system controller',cat:'MCU / CPU / DSP / DSC',block:'MCU',conf:'Medium',pns:[['Renesas RA6M5','https://www.renesas.com/us/en/products/microcontrollers-microprocessors/ra-cortex-m-mcus/ra6m5-200mhz-arm-cortex-m33-trustzone-high-integration'],['NXP i.MX RT1062','https://www.nxp.com/products/i.MX-RT1060']]},
{ss:'Memory & Logs',comp:'Config/event persistence',cat:'MEMORY',block:'EEPROM',conf:'Medium',pns:[['ST M24M02','https://www.st.com/en/memories/m24m02-dr.html'],['Renesas AT24CM02','https://www.renesas.com/us/en/products/memory-logic/eeproms/at24cm02-2-mbit-i2c-compatible-serial-eeprom']]},
{ss:'UI / HMI',comp:'Display control path',cat:'ANALOG',block:'Display Driver',conf:'Low',pns:[['NXP PCF8576D','https://www.nxp.com/products/PCF8576D'],['NXP PCA8538','https://www.nxp.com/products/PCA8538']]},
{ss:'UI / HMI',comp:'Audio output stage',cat:'ANALOG',block:'Audio Amplifier',conf:'Low',pns:[['NXP TFA9874','https://www.nxp.com/products/TFA9874'],['ST TDA7266','https://www.st.com/en/audio-ics/tda7266.html']]},
{ss:'Data / Service',comp:'Wireless/optical transfer',cat:'COMMUNICATION / INTERFACE',block:'Wireless Communication',conf:'Low',pns:[['NXP IW416','https://www.nxp.com/products/wireless-connectivity/wi-fi-plus-bluetooth-plus-802-15-4/iw416'],['NXP QN9090','https://www.nxp.com/products/QN9090']]},
{ss:'Interconnect',comp:'Pads/accessory interfaces',cat:'INTERCONNECT',block:'Connector',conf:'Medium',pns:[['TE MicroMatch','https://www.te.com/usa-en/products/connectors/pcb-connectors/micromatch-connectors.html'],['Hirose DF40','https://www.hirose.com/product/en/products/DF40/']]},
{ss:'Sensors & Control',comp:'Current telemetry',cat:'SENSOR',block:'Current Sensor',conf:'Medium',pns:[['Allegro ACS37612','https://www.allegromicro.com/en/products/sense/current-sensor-ics/integrated-current-sensors/acs37612'],['Melexis MLX91220','https://www.melexis.com/en/product/MLX91220']]},
{ss:'Sensors & Control',comp:'Thermal telemetry',cat:'SENSOR',block:'Temperature',conf:'Medium',pns:[['ST STTS22H','https://www.st.com/en/mems-and-sensors/stts22h.html'],['NXP P3T1755','https://www.nxp.com/products/P3T1755']]}
];
const q=document.getElementById('q'),cat=document.getElementById('cat'),conf=document.getElementById('conf'),out=document.getElementById('out');
cat.innerHTML=['All categories',...new Set(rows.map(r=>r.cat))].map(c=>`<option>${c}</option>`).join('');
function render(){const f=q.value.toLowerCase(),c=cat.value,cf=conf.value;const data=rows.filter(r=>(c==='All categories'||r.cat===c)&&(cf==='All confidence'||r.conf===cf)&&JSON.stringify(r).toLowerCase().includes(f));const g={};data.forEach(r=>(g[r.ss]??=[]).push(r));out.innerHTML=Object.entries(g).map(([k,v])=>`<details open><summary>${k} <span class='c'>${v.length}</span></summary>${v.map(x=>`<div class='item'><div><strong>${x.comp}</strong></div><div class='k'>${x.cat} • ${x.block}</div><div class='pn'>${x.pns.map(p=>`<a href='${p[1]}' target='_blank'>${p[0]}</a>`).join(' | ')}</div><div class='c'>Confidence: ${x.conf}</div></div>`).join('')}</details>`).join('')||'<p class="muted">No matches</p>';}
q.addEventListener('input',render);cat.addEventListener('change',render);conf.addEventListener('change',render);render();
</script></body></html>
