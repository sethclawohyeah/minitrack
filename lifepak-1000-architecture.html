<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LIFEPAK 1000 Architecture Map</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#0a1020;color:#eaf1ff}.wrap{max-width:1120px;margin:0 auto;padding:24px}.hero{padding:18px;border:1px solid #ffffff22;border-radius:14px;background:linear-gradient(135deg,#132748,#0f1c36)}.muted{color:#a8bddf}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}input,select{background:#101a30;border:1px solid #2a3f68;color:#eaf1ff;padding:8px 10px;border-radius:10px}details{margin:10px 0;background:#0f172b;border:1px solid #223657;border-radius:12px;padding:10px}summary{cursor:pointer;font-weight:600}.item{padding:8px 10px;border:1px solid #223657;border-radius:10px;margin:8px 0;background:#0c1528}.k{font-size:12px;color:#9cb3d8}.tag{display:inline-block;font-size:11px;margin-left:8px;padding:2px 8px;border-radius:999px;border:1px solid #315382;background:#183056;color:#b5d4ff}</style></head>
<body><div class="wrap"><div class="hero"><h1>LIFEPAK 1000</h1><div class="muted">Mapped to your revised block/category taxonomy.</div></div>
<div class="toolbar"><input id="q" placeholder="Filter subsystem/component/category/block" style="min-width:320px"/><select id="cat"></select></div><div id="out"></div></div>
<script>
const rows=[
['Power Architecture','Main battery pack','POWER MGT','Battery'],
['Power Architecture','Battery charging/supervision','POWER MGT','Battery Charger'],
['Power Architecture','Primary conversion stage','POWER MGT','DC/DC'],
['Power Architecture','Rail regulation','POWER MGT','Buck/Boost Regulator'],
['Power Architecture','Noise-sensitive local rails','POWER MGT','LDO'],
['Power Architecture','Power sequencing and health','POWER MGT','Power Management Circuit'],
['HV Therapy Path','Charge switch stage','ANALOG','MOSFET/IGBT'],
['HV Therapy Path','Gate control','ANALOG','Gate Drivers'],
['HV Therapy Path','Pulse storage bank','DISCRETES / PASSIVES','Capacitors'],
['HV Therapy Path','HV magnetics','POWER MGT','TRANSFORMER'],
['HV Therapy Path','Output safety disconnect','ELECTROMECHANICAL','Relay'],
['HV Therapy Path','Defib/patient protection net','DISCRETES / PASSIVES','Protection Device'],
['ECG Analog Front End','Input path switching','ANALOG','Analog Switch'],
['ECG Analog Front End','Signal conditioning','ANALOG','OP-AMP'],
['ECG Analog Front End','Noise and anti-alias shaping','ANALOG','Filter'],
['ECG Analog Front End','Signal digitization','ANALOG','Analog to Digital Convertor'],
['Control Compute','Main system controller','MCU / CPU / DSP / DSC','MCU'],
['Control Compute','Timing/watchdog','ANALOG','Timing IC'],
['Control Compute','Clock source','CLOCKING / TIMING MGT','Crystal Oscillators'],
['Memory & Logs','Firmware image','MEMORY','Flash'],
['Memory & Logs','Config/event persistence','MEMORY','EEPROM'],
['UI / HMI','Display panel','DISPLAY','LCD'],
['UI / HMI','Display control','ANALOG','Display Driver'],
['UI / HMI','Status indicators','OPTO & LIGHTING','LED'],
['UI / HMI','Audio output stage','ANALOG','Audio Amplifier'],
['UI / HMI','Acoustic output transducer','ELECTROMECHANICAL','Speaker'],
['UI / HMI','User input controls','ELECTROMECHANICAL','Switch'],
['Data / Service','Wired service channel','COMMUNICATION / INTERFACE','Wired Communication'],
['Data / Service','Wireless/optical transfer path','COMMUNICATION / INTERFACE','Wireless Communication'],
['Interconnect','Pads/accessory physical interfaces','INTERCONNECT','Connector'],
['Sensors & Control','Current telemetry','SENSOR','Current Sensor'],
['Sensors & Control','Voltage telemetry','SENSOR','Voltage Sensor'],
['Sensors & Control','Thermal telemetry','SENSOR','Temperature']
].map(([subsystem,component,category,block])=>({subsystem,component,category,block}));
const cats=['All',...new Set(rows.map(r=>r.category))];
const q=document.getElementById('q'),cat=document.getElementById('cat'),out=document.getElementById('out');
cat.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
function render(){const f=q.value.toLowerCase();const c=cat.value;const data=rows.filter(r=>(c==='All'||r.category===c)&&`${r.subsystem} ${r.component} ${r.category} ${r.block}`.toLowerCase().includes(f));const g={};data.forEach(r=>(g[r.subsystem]??=[]).push(r));out.innerHTML=Object.entries(g).map(([k,v])=>`<details open><summary>${k}<span class='tag'>${v.length}</span></summary>${v.map(x=>`<div class='item'><div><strong>${x.component}</strong></div><div class='k'>${x.category} • ${x.block}</div></div>`).join('')}</details>`).join('')||'<p class="muted">No matches</p>';}
q.addEventListener('input',render);cat.addEventListener('change',render);render();
</script></body></html>
